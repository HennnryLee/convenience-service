[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convenience-service"
version = "1.1.0"
description = "便民服务平台 —— 《软件构造》与《软件质量保证与测试》课程共用被测系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "李行", email = "24012110@example.com" }]
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Login>=0.6,<0.7",
    "Flask-WTF>=1.2,<2.0",
    "WTForms>=3.1,<3.4",
    "email-validator>=2.0",
    "SQLAlchemy>=2.0,<3.0",
    "pypinyin>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "ruff>=0.6",
    "locust>=2.0",
    "selenium>=4.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# pytest：分层目录 + 显式标记 + 严格配置
# 标记由 tests/conftest.py 按目录自动打，新增测试无需手工加 marker。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra --strict-markers --strict-config"
markers = [
    "unit: 单元测试（纯函数 / 服务层，不经过 HTTP）",
    "functional: 功能测试（黑盒方法：等价类、边界值、因果图、功能图）",
    "integration: 集成测试（模块接口与协作）",
    "system: 系统测试（端到端、安全、错误页、响应头）",
    "slow: 运行时间较长的用例",
]
filterwarnings = [
    "ignore::DeprecationWarning:flask_wtf.*",
    "ignore::DeprecationWarning:werkzeug.*",
    # WTForms 3.3 对“元组 choices”的过渡期弃用提示；已在依赖中锁定 <3.4，
    # 后续迁移到 SelectChoice 时再移除该过滤。
    "ignore::DeprecationWarning:wtforms.*",
]

# ---------------------------------------------------------------------------
# coverage：分支覆盖 + 最低门槛（低于门槛 CI 直接失败）
# 说明：语句与分支合计口径见 `coverage report` 的 TOTAL 行。
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 98
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# ruff：静态检查（教材 5.4.7 静态程序分析的可自动化部分）
# E501（行宽）交给编辑器/评审控制，避免对既有中文注释产生大面积噪声。
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501", # 行宽：中文注释与报告文本较多，按 100 列由评审把关
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"] # 测试中 assert False 是有意的失败断言
"scripts/**" = ["B007"] # 报告生成脚本中存在仅用于计数的循环变量

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
