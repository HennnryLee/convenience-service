name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} · 测试与静态检查
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: python -m ruff check app tests scripts deploy run.py seed.py wsgi.py

      - name: 静态程序分析（教材 5.4.7）
        run: python scripts/static_check.py

      - name: 数据库迁移演练
        run: python scripts/check_migration.py

      - name: 全量测试 + 分支覆盖率（低于门槛即失败）
        env:
          CONTRACT_CHECK: "1"
        run: |
          python -m pytest \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: 上传质量报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-py${{ matrix.python-version }}
          path: |
            reports/coverage.xml
            reports/static_analysis.md
          if-no-files-found: warn
